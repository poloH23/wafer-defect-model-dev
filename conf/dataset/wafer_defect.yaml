# Mixed-type Wafer Defect Dataset (MixedWM38)
# Reference: docs/wafer_defect_desc/Description.pdf

name: wafer_defect
source: data/raw/Wafer_Map_Datasets.npz

# Array keys of the official dataset
image_key: arr_0
label_key: arr_1

# 8 basic defect types.
# Order matters: the i-th is the i-th dimenstion of the label vactor.
# An all-zero label vector means "Normal" (no defect)
class_name:
  - Center
  - Donut
  - Edge_Loc
  - Edge_Ring
  - Loc
  - Near_Full
  - Scratch
  - Random

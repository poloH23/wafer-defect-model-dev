# Check the lock files against known vulnerabilities (pip-audit, PyPI advisory data).
#
# Besides every push and pull request, it runs weekly: a lock file that does not change can become
# vulnerable when a new advisory is published, as with the eMudhra / emSign CA incident of 2026-10-20.
name: Dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: "0 1 * * 1"  # Mondays 01:00 UTC (09:00 in Taiwan)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pip from its hash-pinned URL
        run: python -m pip install -r requirements-pip.txt
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit the lock files
        # The lock files pin every package, so nothing needs installing: --no-deps --disable-pip
        run: pip-audit --no-deps --disable-pip -r requirements.txt -r requirements-dev.txt

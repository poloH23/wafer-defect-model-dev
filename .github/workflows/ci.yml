name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Job 1: Execute the defined checks in ".pre-commit-config.yaml"
  # Use the same settings with pre-commit logic
  # Avoid skipping the local checking step with "git commit --no-verify"
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  # Job 2: Perform actual tests, it supports testing for various Python versions (matrix)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install -r requirements-pip.txt
          # The CI machine has no GPU. Install the CPU builds of the pinned torch and torchvision
          # versions (a few hundred MB instead of about 4 GB of CUDA libraries), then the rest of the
          # lock file without its CUDA packages. The pin "torch==X" accepts the CPU build "X+cpu".
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu \
            $(grep -E '^(torch|torchvision)==' requirements-dev.txt)
          grep -v -E '^(nvidia-|cuda-|triton==)' requirements-dev.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install --no-cache-dir -r "$RUNNER_TEMP/requirements-ci.txt"
          pip install --no-cache-dir --no-deps -e .
      - name: Run test with coverage
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py312
          path: coverage.xml

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Job 1: Execute the defined checks oin ".pre-commit-config.yaml"
  # Use the same settings with pre-commit logic
  # Avoid skipping the local checking step with "git commit --no-verify"
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@3.0.1

  # Job 2: Perform actual tests, it supports testing for various Python versions (matrix)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run test with coverage
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py312
          path: coverage.xml

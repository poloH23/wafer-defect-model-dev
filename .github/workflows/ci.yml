name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Job 1: Execute the defined checks in ".pre-commit-config.yaml"
  # Use the same settings with pre-commit logic
  # Avoid skipping the local checking step with "git commit --no-verify"
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  # Job 2: Perform actual tests on Python 3.12, the only version the project supports
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # The cache key follows the lock file that is actually installed
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies (CPU-only PyTorch)
        # The same script as "make init" and "make conda-dev", so every push also tests the setup a user
        # gets from a fresh clone. The CI machine has no GPU: TORCH=cpu installs the CPU builds of the
        # pinned torch and torchvision versions (a few hundred MB instead of about 4 GB of CUDA libraries).
        # No --no-cache-dir: pip has to write its cache for the "pip" cache above to have anything to save.
        run: TORCH=cpu bash shell/install_deps.sh
      - name: Run test with coverage
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py312
          path: coverage.xml
